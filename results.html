<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả khảo sát buổi 2 · Base.vn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04030d;--bg2:#0a0818;--bg3:#100e20;
  --border:rgba(180,160,255,0.12);--border2:rgba(180,160,255,0.22);
  --text:#f0eeff;--text2:#9088b0;--text3:#504868;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --c02:#a78bfa;--c02b:rgba(167,139,250,0.13);--c02t:rgba(167,139,250,0.32);
  --teal:#00c8e0;--tealb:rgba(0,200,224,0.1);
  --green:#34d399;--greenb:rgba(52,211,153,0.1);
  --warn:#f59e0b;--warnb:rgba(245,158,11,0.12);
  --rose:#f472b6;--roseb:rgba(244,114,182,0.1);
}
html{font-size:16px}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);
  min-height:100vh;line-height:1.6;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;top:0;left:0;right:0;bottom:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%,rgba(120,80,255,0.15) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(0,180,220,0.10) 0%,transparent 55%);
  pointer-events:none;z-index:0;
}
.app{max-width:900px;margin:0 auto;padding:0 24px 80px;position:relative;z-index:1}

/* nav */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0;margin-bottom:40px;flex-wrap:wrap;gap:10px}
.brand{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.brand span{color:var(--c02)}
.nav-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#sync-status{font-size:11px;font-family:var(--mono);color:var(--text3)}
.refresh-btn{font-size:11px;font-family:var(--mono);color:var(--c02);background:var(--c02b);border:1px solid var(--c02t);border-radius:6px;padding:4px 10px;cursor:pointer}
.clear-btn{font-size:11px;font-family:var(--mono);color:var(--text3);background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}

/* header */
.dash-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-family:var(--mono);font-weight:500;padding:4px 11px;border-radius:20px;background:var(--c02b);color:var(--c02);letter-spacing:.07em;margin-bottom:14px;border:1px solid var(--c02t)}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--c02);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.7)}70%{box-shadow:0 0 0 7px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}
.sub{font-size:14px;color:var(--text2);margin-bottom:1.5rem}

/* tabs */
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:24px;width:fit-content}
.tab{padding:6px 16px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent;font-family:var(--font)}
.tab.active{background:var(--bg3);color:var(--text);border:1px solid var(--border)}

/* stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat-card{background:rgba(10,8,24,0.8);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;backdrop-filter:blur(8px)}
.stat-num{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat-label{font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:4px;letter-spacing:.05em}

/* section */
.section{margin-bottom:24px}
.section-title{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* chart card */
.chart-card{background:rgba(10,8,24,0.8);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:10px;backdrop-filter:blur(8px)}
.chart-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:14px;letter-spacing:-.01em}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--text2);width:200px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bar-val{font-size:11px;font-family:var(--mono);color:var(--text3);width:28px;text-align:right}

/* scale vis */
.scale-vis{display:flex;gap:6px;align-items:flex-end;height:60px;margin-bottom:4px}
.scale-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.scale-bar-wrap{width:100%;display:flex;align-items:flex-end;justify-content:center;flex:1}
.scale-bar{width:70%;border-radius:4px 4px 0 0;transition:height .4s ease;min-height:4px}
.scale-num{font-size:13px;font-weight:600;color:var(--text2)}
.scale-count{font-size:10px;font-family:var(--mono);color:var(--text3)}

/* grid */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* answers */
.answers-card{background:rgba(10,8,24,0.8);border:1px solid var(--border);border-radius:14px;padding:18px 20px;backdrop-filter:blur(8px)}
.answer-item{border-bottom:1px solid var(--border);padding:12px 0}
.answer-item:last-child{border-bottom:none;padding-bottom:0}
.answer-meta{font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.role-pill{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
.answer-text{font-size:13px;color:var(--text2);line-height:1.55}

/* speaker */
.speaker-q{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.speaker-q-meta{font-size:10px;font-family:var(--mono);color:var(--warn);margin-bottom:5px}
.speaker-q-text{font-size:13px;color:var(--text2);line-height:1.5}
.vote-bar{height:4px;background:rgba(245,158,11,0.15);border-radius:2px;margin-top:8px;overflow:hidden}
.vote-fill{height:100%;background:var(--warn);border-radius:2px}

/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-title{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text2)}
.empty-sub{font-size:13px;line-height:1.6}
.survey-link{display:inline-block;margin-top:16px;font-size:13px;font-family:var(--mono);color:var(--c02);border:1px solid var(--c02t);padding:7px 16px;border-radius:8px;text-decoration:none}

@media(max-width:600px){
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .bar-label{width:120px}
}
</style>
</head>
<body>
<div class="app">

<div class="topnav">
  <div class="brand">Base<span>.vn</span></div>
  <div class="nav-right">
    <span id="sync-status"></span>
    <button class="refresh-btn" onclick="render()">↻ Refresh</button>
    <button class="clear-btn" onclick="clearData()">Xóa cache</button>
  </div>
</div>

<div class="dash-badge"><span class="live-dot"></span>LIVE · SESSION 02 · HIỂU KHÁCH HÀNG</div>
<h1>Kết quả khảo sát</h1>
<p class="sub">Cập nhật real-time từ Google Sheets · Auto-refresh 30 giây</p>

<div class="tabs">
  <button class="tab active" onclick="switchTab('overview',this)">Tổng quan</button>
  <button class="tab" onclick="switchTab('details',this)">Chi tiết</button>
  <button class="tab" onclick="switchTab('speaker',this)">Câu hỏi diễn giả</button>
</div>

<div id="tab-overview"></div>
<div id="tab-details" style="display:none"></div>
<div id="tab-speaker" style="display:none"></div>

</div>
<script>
// ── CONFIG ───────────────────────────────────────────────────────
var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSk4xh4KL5HbLmrKNgv3aDsVNwOqp3tQFISOoC97Y18g3by29EVp9WaLvJ3koz_orn1XemaNHNICI66/pub?gid=0&single=true&output=csv';
// ─────────────────────────────────────────────────────────────────

var ROLE_COLOR={SE:'#00c8e0',DA:'#a78bfa',DE:'#34d399'};
var ROLE_BG={SE:'rgba(0,200,224,0.15)',DA:'rgba(167,139,250,0.15)',DE:'rgba(52,211,153,0.15)'};

var ROLEQ_LABEL={
  se_qualify:'Qualify KH',se_demo:'Demo thuyết phục',se_objection:'Objection giá',
  se_output:'Viết output',se_followup:'Follow-up',se_internal:'Phối hợp nội bộ',
  da_need:'Hiểu nhu cầu',da_translate:'Dịch yêu cầu',da_trust:'Tạo niềm tin',
  da_story:'Data storytelling',da_scope:'Quản lý scope',da_handoff:'Nhận handoff',
  de_requirement:'Requirement rõ',de_change:'Thay đổi liên tục',de_context:'Thiếu context',
  de_quality:'Data quality',de_timeline:'Timeline gấp',de_communication:'Giao tiếp'
};
var Q8_LABEL={segment:'Phân loại KH',role:'Vai trò rõ hơn',data:'Data signals',toolkit:'Toolkit',case:'Case thực tế'};
var SPEAKER_LABEL={
  q_mistake:'Sai lầm khi tiếp cận KH lần đầu',q_real:'Phân biệt KH thật vs tìm hiểu',
  q_de_data:'DE hiểu KH qua data',q_sme_ent:'SME vs Enterprise',
  q_when_da:'DA tham gia từ bước nào',q_handoff:'Template handoff SE → DA'
};

// RFC-4180 CSV parser
function parseCSV(text){
  function parseLine(line){
    var cols=[],re=/("(?:[^"]|"")*"|[^,]*)(,|$)/g,m;
    while((m=re.exec(line))!==null){
      var v=m[1];
      if(v.charAt(0)==='"'&&v.charAt(v.length-1)==='"')
        v=v.slice(1,-1).replace(/""/g,'"');
      cols.push(v.trim());
      if(m[2]==='') break;
    }
    return cols;
  }
  var lines=text.trim().split('\n');
  if(lines.length<2) return [];
  var rows=[];
  for(var i=1;i<lines.length;i++){
    var c=parseLine(lines[i]);
    var r={
      ts:c[0]||'',name:c[1]||'An danh',
      q1:c[2]?c[2].split(';'):[],
      roleq:c[3]?c[3].split(';'):[],
      roleq_other:c[4]||'',
      q3:c[5]||'',q4:parseInt(c[6])||0,
      q6:c[7]||'',
      q8:c[8]?c[8].split(';'):[],
      speaker_q:c[9]?c[9].split(';'):[],
      q9:c[10]||''
    };
    if(r.q1.length) rows.push(r);
  }
  return rows;
}

function getLocal(){
  var raw=JSON.parse(localStorage.getItem('survey_s02')||'[]');
  // Normalize: localStorage lưu q1 dạng string "SE;DA", cần convert thành array
  return raw.map(function(r){
    function toArr(v){ return v ? (Array.isArray(v)?v:String(v).split(';').filter(Boolean)) : []; }
    return {
      ts:r.ts||'',name:r.name||'An danh',
      q1:toArr(r.q1),roleq:toArr(r.roleq),
      roleq_other:r.roleq_other||'',
      q3:r.q3||'',q4:parseInt(r.q4)||0,
      q6:r.q6||'',q8:toArr(r.q8),
      speaker_q:toArr(r.speaker_q),q9:r.q9||''
    };
  });
}

function setStatus(msg,color){
  var el=document.getElementById('sync-status');
  if(el){el.textContent=msg;el.style.color=color||'var(--text3)';}
}

function countArr(data,key){
  var m={};
  for(var i=0;i<data.length;i++){
    var vals=data[i][key];
    if(!vals) continue;
    if(typeof vals==='string') vals=vals.split(';');
    for(var j=0;j<vals.length;j++){
      var v=(vals[j]||'').trim();if(!v)continue;
      m[v]=(m[v]||0)+1;
    }
  }
  return m;
}
function countOne(data,key){
  var m={};
  for(var i=0;i<data.length;i++){
    var v=data[i][key];if(!v)continue;
    m[v]=(m[v]||0)+1;
  }
  return m;
}
function avgQ4(data){
  var sum=0,cnt=0;
  for(var i=0;i<data.length;i++){if(data[i].q4){sum+=data[i].q4;cnt++;}}
  return cnt?sum/cnt:0;
}

function bar(label,count,total,color){
  color=color||'#a78bfa';
  var pct=total?Math.round(count/total*100):0;
  return '<div class="bar-row">'
    +'<div class="bar-label">'+label+'</div>'
    +'<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'
    +'<div class="bar-val">'+count+'</div>'
    +'</div>';
}

function sortDesc(obj){
  var arr=[];
  for(var k in obj) arr.push([k,obj[k]]);
  arr.sort(function(a,b){return b[1]-a[1];});
  return arr;
}

function renderOverview(data){
  if(!data.length) return emptyState();
  var n=data.length;
  var avgScore=avgQ4(data).toFixed(1);
  var roles=countOne(data,'q1');
  var roleFlat={};
  for(var i=0;i<data.length;i++){
    var rl=data[i].q1;
    // q1 có thể là array (từ Sheets CSV) hoặc string "SE;DA" (từ localStorage)
    if(typeof rl==='string') rl=rl.split(';');
    if(!rl||!rl.length) continue;
    for(var j=0;j<rl.length;j++){
      var rv=(rl[j]||'').trim();
      if(!rv||rv.length>10) continue; // bỏ qua giá trị lạ
      roleFlat[rv]=(roleFlat[rv]||0)+1;
    }
  }
  var roleq=countArr(data,'roleq');
  var q8=countArr(data,'q8');
  var q3=countOne(data,'q3');
  var speakerq=countArr(data,'speaker_q');
  var scaleDist=[0,0,0,0,0];
  for(var i=0;i<data.length;i++){if(data[i].q4>=1&&data[i].q4<=5)scaleDist[data[i].q4-1]++;}
  var scaleMax=Math.max.apply(null,scaleDist)||1;
  var scaleColors=['#f472b6','#f59e0b','#f59e0b','#34d399','#34d399'];

  var html='<div class="stats-row">'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--c02)">'+n+'</div><div class="stat-label">PHẢN HỒI</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--teal)">'+avgScore+'</div><div class="stat-label">ĐIỂM TB HIỂU KH</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--green)">'+Object.keys(roleFlat).length+'</div><div class="stat-label">ROLES</div></div>'
    +'<div class="stat-card"><div class="stat-num" style="color:var(--warn)">'+data.filter(function(r){return r.q9||r.speaker_q.length}).length+'</div><div class="stat-label">CÂU HỎI DIỄN GIẢ</div></div>'
    +'</div>';

  html+='<div class="section"><div class="section-title">Vai trò & đánh giá</div>'
    +'<div class="grid2">'
    +'<div class="chart-card"><div class="chart-title">Phân bổ theo role</div>'
    +sortDesc(roleFlat).map(function(item){return bar(item[0],item[1],n,ROLE_COLOR[item[0]]||'#a78bfa');}).join('')
    +'</div>'
    +'<div class="chart-card"><div class="chart-title">Mức độ hiểu KH (tự đánh giá)</div>'
    +'<div class="scale-vis">'
    +[1,2,3,4,5].map(function(v,i){
      return '<div class="scale-col">'
        +'<div class="scale-bar-wrap"><div class="scale-bar" style="height:'+Math.round(scaleDist[i]/scaleMax*50+4)+'px;background:'+scaleColors[i]+'"></div></div>'
        +'<div class="scale-num">'+v+'</div>'
        +'<div class="scale-count">'+scaleDist[i]+'</div>'
        +'</div>';
    }).join('')
    +'</div>'
    +'<div style="font-size:11px;color:var(--text3);text-align:center;margin-top:4px">Trung bình: <span style="color:var(--c02);font-weight:600">'+avgScore+'/5</span></div>'
    +'</div></div></div>';

  html+='<div class="section"><div class="section-title">Vướng mắc theo role</div>'
    +'<div class="chart-card"><div class="chart-title">Top điểm vướng</div>'
    +sortDesc(roleq).slice(0,8).map(function(item){
      return bar(ROLEQ_LABEL[item[0]]||item[0],item[1],n,'#f472b6');
    }).join('')+'</div></div>';

  html+='<div class="section"><div class="section-title">Takeaway & tiếp xúc KH</div>'
    +'<div class="grid2">'
    +'<div class="chart-card"><div class="chart-title">Mong muốn sau buổi 2</div>'
    +sortDesc(q8).map(function(item){return bar(Q8_LABEL[item[0]]||item[0],item[1],n,'#34d399');}).join('')
    +'</div>'
    +'<div class="chart-card"><div class="chart-title">Mức độ tiếp xúc KH</div>'
    +sortDesc(q3).map(function(item){
      var lbl={daily:'Hàng ngày',weekly:'Vài lần/tuần',monthly:'Thỉnh thoảng',rare:'Hiếm khi'};
      return bar(lbl[item[0]]||item[0],item[1],n,'#00c8e0');
    }).join('')+'</div></div></div>';

  if(Object.keys(speakerq).length){
    html+='<div class="section"><div class="section-title">Câu hỏi diễn giả được vote nhiều</div>'
      +'<div class="chart-card"><div class="chart-title">Số lượt chọn</div>'
      +sortDesc(speakerq).map(function(item){return bar(SPEAKER_LABEL[item[0]]||item[0],item[1],n,'#f59e0b');}).join('')
      +'</div></div>';
  }
  return html;
}

function renderDetails(data){
  if(!data.length) return emptyState();
  var cases=data.filter(function(r){return r.q6;});
  var frees=data.filter(function(r){return r.roleq_other;});
  var html='';
  if(cases.length){
    html+='<div class="section"><div class="section-title">'+cases.length+' case study thuc te</div>'
      +'<div class="answers-card">'
      +cases.map(function(r){
        var roles=r.q1;
        var roleTag=roles.map(function(rv){
          return '<span class="role-pill" style="background:'+(ROLE_BG[rv]||'rgba(255,255,255,0.1)')+';color:'+(ROLE_COLOR[rv]||'#a78bfa')+'">'+rv+'</span>';
        }).join(' ');
        return '<div class="answer-item">'
          +'<div class="answer-meta">'+roleTag+'<span>'+r.name+'</span><span style="margin-left:auto">'+r.ts+'</span></div>'
          +'<div class="answer-text">'+r.q6+'</div>'
          +'</div>';
      }).join('')
      +'</div></div>';
  }
  if(frees.length){
    html+='<div class="section"><div class="section-title">Vướng mắc tự điền thêm</div>'
      +'<div class="answers-card">'
      +frees.map(function(r){
        return '<div class="answer-item">'
          +'<div class="answer-meta"><span style="color:var(--c02);font-family:var(--mono)">'+r.q1.join('+')+'</span><span>'+r.name+'</span></div>'
          +'<div class="answer-text">'+r.roleq_other+'</div>'
          +'</div>';
      }).join('')
      +'</div></div>';
  }
  html+='<div class="section"><div class="section-title">Tất cả '+data.length+' phản hồi</div>'
    +'<div class="answers-card">'
    +data.map(function(r,i){
      var roles=r.q1;
      var roleTag=roles.map(function(rv){
        return '<span class="role-pill" style="background:'+(ROLE_BG[rv]||'rgba(255,255,255,0.1)')+';color:'+(ROLE_COLOR[rv]||'#a78bfa')+'">'+rv+'</span>';
      }).join(' ');
      return '<div class="answer-item">'
        +'<div class="answer-meta"><span style="color:var(--text3)">#'+(i+1)+'</span>'+roleTag
        +'<span>'+r.name+'</span>'
        +'<span style="margin-left:auto;color:var(--c02)">'+r.q4+'/5</span>'
        +'<span style="margin-left:auto">'+r.ts+'</span></div>'
        +'<div class="answer-text">Tiếp xúc KH: '+(r.q3||'—')+' · Vướng: '+(r.roleq.map(function(v){return ROLEQ_LABEL[v]||v;}).join(', ')||'—')+'</div>'
        +'</div>';
    }).join('')
    +'</div></div>';
  return html;
}

function renderSpeaker(data){
  var votes={};
  var custom=[];
  for(var i=0;i<data.length;i++){
    var r=data[i];
    for(var j=0;j<r.speaker_q.length;j++){
      var v=r.speaker_q[j];if(!v)continue;
      votes[v]=(votes[v]||0)+1;
    }
    if(r.q9) custom.push({name:r.name,q1:r.q1,q9:r.q9,ts:r.ts});
  }
  if(!Object.keys(votes).length&&!custom.length)
    return '<div class="empty"><div class="empty-title">Chưa có câu hỏi nào</div><div class="empty-sub">Sẽ hiển thị khi có người gửi khảo sát.</div></div>';

  var html='';
  var sorted=sortDesc(votes);
  var maxVote=sorted.length?sorted[0][1]:1;
  if(sorted.length){
    html+='<div class="section"><div class="section-title">Câu hỏi được vote nhiều nhất</div>';
    for(var i=0;i<sorted.length;i++){
      var k=sorted[i][0],v=sorted[i][1];
      html+='<div class="speaker-q">'
        +'<div class="speaker-q-meta">'+v+' vote</div>'
        +'<div class="speaker-q-text">'+(SPEAKER_LABEL[k]||k)+'</div>'
        +'<div class="vote-bar"><div class="vote-fill" style="width:'+Math.round(v/maxVote*100)+'%"></div></div>'
        +'</div>';
    }
    html+='</div>';
  }
  if(custom.length){
    html+='<div class="section"><div class="section-title">'+custom.length+' câu hỏi tự đặt</div>';
    for(var i=0;i<custom.length;i++){
      var c=custom[i];
      var roles=c.q1;
      var roleTag=roles.map(function(rv){
        return '<span class="role-pill" style="background:'+(ROLE_BG[rv]||'rgba(255,255,255,0.1)')+';color:'+(ROLE_COLOR[rv]||'#a78bfa')+'">'+rv+'</span>';
      }).join(' ');
      html+='<div class="speaker-q">'
        +'<div class="speaker-q-meta">'+roleTag+' '+c.name+' · '+c.ts+'</div>'
        +'<div class="speaker-q-text">'+c.q9+'</div>'
        +'</div>';
    }
    html+='</div>';
  }
  return html;
}

function emptyState(){
  return '<div class="empty"><div class="empty-title">Chua co phản hồi nao</div>'
    +'<div class="empty-sub">Chia sẻ link form cho team điền.<br>Trang này tự cập nhật mỗi 30 giây.</div>'
    +'<a href="index.html" class="survey-link">Mở form khảo sát &#x2192;</a></div>';
}

function render(){
  setStatus('Đang tải...');
  if(SHEET_CSV_URL!=='https://docs.google.com/spreadsheets/d/e/2PACX-1vSk4xh4KL5HbLmrKNgv3aDsVNwOqp3tQFISOoC97Y18g3by29EVp9WaLvJ3koz_orn1XemaNHNICI66/pub?gid=0&single=true&output=csv'){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',SHEET_CSV_URL+'&t='+Date.now(),true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4) return;
      var data=[];
      if(xhr.status===200){
        try{ data=parseCSV(xhr.responseText); }catch(e){}
        if(data.length>0){
          // Sheets có data → dùng Sheets làm source of truth, không merge localStorage
          setStatus('Cập nhật lúc '+new Date().toLocaleTimeString('vi-VN'),'#34d399');
        } else {
          // Sheets trống (chưa có data hoặc chưa publish) → fallback localStorage
          data=getLocal();
          setStatus('Sheets trống — hiển thị cache local','#f59e0b');
        }
      } else {
        data=getLocal();
        setStatus('Dùng cache (lỗi kết nối)','#f59e0b');
      }
      paint(data);
    };
    xhr.send();
  } else {
    var data=getLocal();
    setStatus('Local mode (chưa cấu hình Sheets)','#f59e0b');
    paint(data);
  }
}

function paint(data){
  document.getElementById('tab-overview').innerHTML=renderOverview(data);
  document.getElementById('tab-details').innerHTML=renderDetails(data);
  document.getElementById('tab-speaker').innerHTML=renderSpeaker(data);
}

function switchTab(id,el){
  var tabs=['overview','details','speaker'];
  for(var i=0;i<tabs.length;i++)
    document.getElementById('tab-'+tabs[i]).style.display=tabs[i]===id?'block':'none';
  var btns=document.querySelectorAll('.tab');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  el.classList.add('active');
}

function clearData(){
  if(confirm('Xóa cache localStorage? (Dữ liệu trên Sheets không bị xóa)')){
    localStorage.removeItem('survey_s02');render();
  }
}

render();
setInterval(render,30000);
window.addEventListener('storage',function(e){if(e.key==='survey_s02')render();});
</script>
</body>
</html>
