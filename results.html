<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả khảo sát buổi 2 · Base.vn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090f;--bg2:#111118;--bg3:#181820;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f4;--text2:#9090a0;--text3:#585868;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
  --c02:#a78bfa;--c02b:rgba(167,139,250,0.12);--c02t:rgba(167,139,250,0.3);
  --teal:#00c8e0;--tealb:rgba(0,200,224,0.12);
  --green:#34d399;--greenb:rgba(52,211,153,0.12);
  --warn:#f59e0b;--warnb:rgba(245,158,11,0.12);
  --rose:#f472b6;--roseb:rgba(244,114,182,0.12);
}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;line-height:1.6}
.app{max-width:860px;margin:0 auto;padding:0 24px 80px}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:28px 0 0;margin-bottom:40px}
.brand{font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand span{color:var(--c02)}
.nav-right{display:flex;align-items:center;gap:12px}
.nav-meta{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.05em}
.refresh-btn{font-size:11px;font-family:var(--mono);color:var(--c02);background:var(--c02b);border:1px solid var(--c02t);border-radius:6px;padding:4px 10px;cursor:pointer}
.refresh-btn:hover{opacity:.8}
.clear-btn{font-size:11px;font-family:var(--mono);color:var(--text3);background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer}
.clear-btn:hover{border-color:var(--border2);color:var(--text2)}

.page-header{margin-bottom:36px}
.dash-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-family:var(--mono);font-weight:500;padding:4px 11px;border-radius:20px;background:var(--c02b);color:var(--c02);letter-spacing:.07em;margin-bottom:14px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--c02);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.6)}70%{box-shadow:0 0 0 6px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}
.sub{font-size:14px;color:var(--text2)}

/* stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat-label{font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:4px;letter-spacing:.05em}

/* section */
.section{margin-bottom:28px}
.section-title{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* chart card */
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:10px}
.chart-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:14px;letter-spacing:-.01em}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--text2);width:160px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bar-val{font-size:11px;font-family:var(--mono);color:var(--text3);width:32px;text-align:right}

/* scale vis */
.scale-vis{display:flex;gap:6px;align-items:flex-end;height:60px;margin-bottom:4px}
.scale-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.scale-bar-wrap{width:100%;display:flex;align-items:flex-end;justify-content:center;flex:1}
.scale-bar{width:70%;border-radius:4px 4px 0 0;transition:height .4s ease;min-height:4px}
.scale-num{font-size:13px;font-weight:600;color:var(--text2)}
.scale-count{font-size:10px;font-family:var(--mono);color:var(--text3)}

/* grid 2col */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* open answers */
.answers-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.answer-item{border-bottom:1px solid var(--border);padding:12px 0}
.answer-item:last-child{border-bottom:none;padding-bottom:0}
.answer-meta{font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:4px;display:flex;gap:8px}
.answer-role{padding:2px 7px;border-radius:4px;background:var(--c02b);color:var(--c02)}
.answer-text{font-size:13px;color:var(--text2);line-height:1.55}

/* speaker Q */
.speaker-q{background:var(--bg3);border:1px solid var(--warnb);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.speaker-q-meta{font-size:10px;font-family:var(--mono);color:var(--warn);margin-bottom:5px}
.speaker-q-text{font-size:13px;color:var(--text2);line-height:1.5}

/* empty */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-title{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text2)}
.empty-sub{font-size:13px;line-height:1.6}
.survey-link{display:inline-block;margin-top:16px;font-size:13px;font-family:var(--mono);color:var(--c02);border:1px solid var(--c02t);padding:7px 16px;border-radius:8px;text-decoration:none}

/* tab */
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:20px;width:fit-content}
.tab{padding:6px 16px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);transition:all .15s;border:none;background:transparent;font-family:var(--font)}
.tab.active{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
</style>
</head>
<body>
<div class="app">

<div class="topnav">
  <div class="brand">Base<span>.vn</span></div>
  <div class="nav-right">
    <span id="sync-status" style="font-size:11px;font-family:var(--mono);color:var(--text3)"></span>
    <button class="refresh-btn" onclick="render()">↻ Refresh</button>
    <button class="clear-btn" onclick="clearData()">Xóa cache</button>
    <div class="nav-meta">RESULTS DASHBOARD</div>
  </div>
</div>

<div class="page-header">
  <div class="dash-badge"><span class="live-dot"></span>LIVE · SESSION 02 · HIỂU KHÁCH HÀNG</div>
  <h1>Kết quả khảo sát</h1>
  <p class="sub">Cập nhật real-time từ localStorage — mở cùng trình duyệt với form khảo sát</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('overview',this)">Tổng quan</button>
  <button class="tab" onclick="switchTab('details',this)">Chi tiết câu trả lời</button>
  <button class="tab" onclick="switchTab('speaker',this)">Câu hỏi diễn giả</button>
</div>

<div id="tab-overview"></div>
<div id="tab-details" style="display:none"></div>
<div id="tab-speaker" style="display:none"></div>

</div>

<script>
const ROLE_COLOR={SE:'var(--teal)',DA:'var(--c02)',DE:'var(--green)',Other:'var(--text3)'};
const ROLE_BG={SE:'var(--tealb)',DA:'var(--c02b)',DE:'var(--greenb)',Other:'var(--border)'};

const Q2L={FnB:'F&B',Retail:'Retail',Manufacturing:'Manufacturing',Education:'Education',Healthcare:'Healthcare',Tech:'Tech',Mixed:'Đa ngành'};
const Q3L={daily:'Hàng ngày',weekly:'Vài lần/tuần',monthly:'Thỉnh thoảng',rare:'Hiếm khi'};
const Q5L={need:'Hiểu nhu cầu KH',trust:'Tạo niềm tin',stakeholder:'Xác định người QĐ',translate:'Dịch yêu cầu',signal:'Tín hiệu churn/expand',segment:'SME vs Enterprise'};
const Q7L={handoff:'Handoff hay rơi',language:'Ngôn ngữ khác nhau',timing:'Sai thời điểm',feedback:'Thiếu feedback loop',ok:'Phối hợp ổn'};
const Q8L={segment:'Phân loại KH',role:'Rõ vai trò SE/DA/DE',data:'Data signals',toolkit:'Toolkit thực tế',case:'Case thực tế'};

function getData(){return JSON.parse(localStorage.getItem('survey_s02')||'[]');}

function count(arr,key){
  const m={};
  arr.forEach(r=>{
    const v=r[key];
    if(!v)return;
    if(Array.isArray(v))v.forEach(x=>{m[x]=(m[x]||0)+1;});
    else m[v]=(m[v]||0)+1;
  });
  return m;
}

function avg(arr,key){
  const vals=arr.map(r=>r[key]).filter(Boolean);
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
}

function bar(label,count,total,color='var(--c02)'){
  const pct=total?Math.round(count/total*100):0;
  return `<div class="bar-row">
    <div class="bar-label">${label}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="bar-val">${count}<span style="color:var(--text3);font-size:9px"> /${total}</span></div>
  </div>`;
}

function renderOverview(data){
  if(!data.length) return emptyState();
  const n=data.length;
  const avgScore=avg(data,'q4').toFixed(1);

  const roles=count(data,'q1');
  const q5=count(data,'q5');
  const q2=count(data,'q2');
  const q3=count(data,'q3');
  const q7=count(data,'q7');
  const q8=count(data,'q8');

  // scale distribution
  const scaleDist=[1,2,3,4,5].map(v=>data.filter(r=>r.q4===v).length);
  const scaleMax=Math.max(...scaleDist,1);

  const scaleColors=['var(--rose)','var(--warn)','var(--warn)','var(--green)','var(--green)'];

  return `
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" style="color:var(--c02)">${n}</div><div class="stat-label">PHẢN HỒI</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--teal)">${avgScore}</div><div class="stat-label">ĐIỂM TB HIỂU KH</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${Object.keys(roles).length}</div><div class="stat-label">ROLES THAM GIA</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--warn)">${data.filter(r=>r.q9).length}</div><div class="stat-label">CÂU HỎI DIỄN GIẢ</div></div>
  </div>

  <div class="section">
    <div class="section-title">Vai trò</div>
    <div class="grid2">
      <div class="chart-card">
        <div class="chart-title">Phân bổ theo role</div>
        ${Object.entries(roles).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(k,v,n,ROLE_COLOR[k]||'var(--c02)')).join('')}
      </div>
      <div class="chart-card">
        <div class="chart-title">Mức độ hiểu KH (tự đánh giá)</div>
        <div class="scale-vis">
          ${[1,2,3,4,5].map((v,i)=>`
            <div class="scale-col">
              <div class="scale-bar-wrap">
                <div class="scale-bar" style="height:${Math.round(scaleDist[i]/scaleMax*50)+4}px;background:${scaleColors[i]}"></div>
              </div>
              <div class="scale-num">${v}</div>
              <div class="scale-count">${scaleDist[i]}</div>
            </div>`).join('')}
        </div>
        <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:4px">Trung bình: <span style="color:var(--c02);font-weight:600">${avgScore}/5</span></div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Ngành KH & tiếp xúc</div>
    <div class="grid2">
      <div class="chart-card">
        <div class="chart-title">Nhóm KH làm việc nhiều nhất</div>
        ${Object.entries(q2).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(Q2L[k]||k,v,n)).join('')}
      </div>
      <div class="chart-card">
        <div class="chart-title">Mức độ tiếp xúc KH trực tiếp</div>
        ${Object.entries(q3).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(Q3L[k]||k,v,n,'var(--teal)')).join('')}
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Pain points & kỳ vọng</div>
    <div class="grid2">
      <div class="chart-card">
        <div class="chart-title">Khó khăn nhiều nhất khi làm với KH</div>
        ${Object.entries(q5).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(Q5L[k]||k,v,n,'var(--rose)')).join('')}
      </div>
      <div class="chart-card">
        <div class="chart-title">Takeaway mong muốn nhất</div>
        ${Object.entries(q8).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(Q8L[k]||k,v,n,'var(--green)')).join('')}
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Phối hợp nội bộ SE · DA · DE</div>
    <div class="chart-card">
      <div class="chart-title">Điểm thiếu trong phối hợp hiện tại</div>
      ${Object.entries(q7).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(Q7L[k]||k,v,n,'var(--warn)')).join('')}
    </div>
  </div>`;
}

function renderDetails(data){
  if(!data.length) return emptyState();
  const cases=data.filter(r=>r.q6);
  return `
  <div class="section">
    <div class="section-title">Tình huống KH khó xử (case study)</div>
    <div class="answers-card">
      ${cases.length?cases.map(r=>`
        <div class="answer-item">
          <div class="answer-meta">
            <span class="answer-role" style="background:${ROLE_BG[r.q1]||'var(--border)'};color:${ROLE_COLOR[r.q1]||'var(--text3)'}">${r.q1||'?'}</span>
            <span>${r.name}</span>
            <span>${r.ts}</span>
          </div>
          <div class="answer-text">${r.q6}</div>
        </div>`).join('')
      :'<div style="color:var(--text3);font-size:13px;padding:8px 0">Chưa có câu trả lời nào.</div>'}
    </div>
  </div>

  <div class="section">
    <div class="section-title">Danh sách phản hồi (${data.length} người)</div>
    <div class="answers-card">
      ${data.map((r,i)=>`
        <div class="answer-item">
          <div class="answer-meta">
            <span style="color:var(--text3)">#${i+1}</span>
            <span class="answer-role" style="background:${ROLE_BG[r.q1]||'var(--border)'};color:${ROLE_COLOR[r.q1]||'var(--text3)'}">${r.q1||'?'}</span>
            <span>${r.name}</span>
            <span style="margin-left:auto">${r.ts}</span>
          </div>
          <div class="answer-text">
            Ngành: ${(r.q2||[]).join(', ')||'—'} ·
            Tiếp xúc KH: ${r.q3||'—'} ·
            Điểm tự đánh giá: <span style="color:var(--c02);font-weight:600">${r.q4||'—'}/5</span>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function renderSpeaker(data){
  const qs=data.filter(r=>r.q9);
  if(!qs.length) return `<div class="empty"><div class="empty-title">Chưa có câu hỏi nào</div><div class="empty-sub">Khi người dùng điền câu hỏi cho diễn giả, chúng sẽ hiển thị ở đây.</div></div>`;
  return `
  <div class="section">
    <div class="section-title">${qs.length} câu hỏi cho diễn giả</div>
    ${qs.map(r=>`
      <div class="speaker-q">
        <div class="speaker-q-meta">${r.q1||'?'} · ${r.name} · ${r.ts}</div>
        <div class="speaker-q-text">${r.q9}</div>
      </div>`).join('')}
  </div>`;
}

function emptyState(){
  return `<div class="empty">
    <div class="empty-title">Chưa có phản hồi nào</div>
    <div class="empty-sub">Chia sẻ link form khảo sát cho team điền.<br>Trang này tự cập nhật mỗi 30 giây.</div>
    <a href="survey.html" class="survey-link">Mở form khảo sát →</a>
  </div>`;
}

// ── CONFIG ────────────────────────────────────────────────────────
// Sau khi publish Google Sheet: File → Share → Publish to web → CSV
// Chọn sheet "responses" → copy URL vào đây
const SHEET_CSV_URL = 'YOUR_GOOGLE_SHEET_CSV_URL_HERE';
// ─────────────────────────────────────────────────────────────────

// Parse CSV → array of response objects (columns: ts,name,q1,roleq,q3,q4,q5,q6,q7,q8,q9)
function parseCSV(text){
  const lines = text.trim().split('\n');
  return lines.slice(1).map(line => {
    const cols = line.split(',').map(c => c.replace(/^"|"$/g,'').trim());
    return {
      ts:    cols[0]||'',
      name:  cols[1]||'Ẩn danh',
      q1:    cols[2] ? cols[2].split(';') : [],
      roleq: cols[3] ? cols[3].split(';') : [],
      q3:    cols[4]||'',
      q4:    parseInt(cols[5])||0,
      q5:    cols[6] ? cols[6].split(';') : [],
      q6:    cols[7]||'',
      q7:    cols[8] ? cols[8].split(';') : [],
      q8:    cols[9] ? cols[9].split(';') : [],
      q9:    cols[10]||''
    };
  }).filter(r => r.name);
}

function getLocalData(){
  return JSON.parse(localStorage.getItem('survey_s02')||'[]');
}

function setStatus(msg, color='var(--text3)'){
  const el = document.getElementById('sync-status');
  if(el){ el.textContent = msg; el.style.color = color; }
}

async function render(){
  setStatus('Đang tải...');
  let data = [];

  if(SHEET_CSV_URL !== 'YOUR_GOOGLE_SHEET_CSV_URL_HERE'){
    try {
      const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
      const text = await res.text();
      data = parseCSV(text);
      // merge với localStorage backup (tránh mất data khi offline)
      const local = getLocalData();
      const sheetIds = new Set(data.map(r=>r.ts+r.name));
      local.forEach(r => { if(!sheetIds.has(r.ts+r.name)) data.push(r); });
      setStatus('Cập nhật lúc ' + new Date().toLocaleTimeString('vi-VN'), 'var(--green)');
    } catch(e) {
      data = getLocalData();
      setStatus('Không tải được từ Sheets — dùng cache', 'var(--warn)');
    }
  } else {
    data = getLocalData();
    setStatus('Chế độ local (chưa cấu hình Sheets URL)', 'var(--warn)');
  }

  document.getElementById('tab-overview').innerHTML = renderOverview(data);
  document.getElementById('tab-details').innerHTML  = renderDetails(data);
  document.getElementById('tab-speaker').innerHTML  = renderSpeaker(data);
}

function switchTab(id,el){
  ['overview','details','speaker'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===id?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function clearData(){
  if(confirm('Xóa cache localStorage? (Dữ liệu trên Sheets không bị xóa)')){
    localStorage.removeItem('survey_s02');
    render();
  }
}

render();
setInterval(render, 30000);
window.addEventListener('storage', e => { if(e.key==='survey_s02') render(); });
</script>
</body>
</html>
